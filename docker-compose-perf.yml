services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-perf
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-perf
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-perf:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-perf:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7.2-alpine
    container_name: redis-perf

  postgres-perf:
    image: postgres:15-alpine
    container_name: postgres-perf
    command: postgres -c max_connections=200
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: alarmdb
      POSTGRES_USER: alarmuser
      POSTGRES_PASSWORD: alarmpass

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm-perf
    ports:
      - "3000:3000"   # Grafana UI
      - "4318:4318"   # OTLP HTTP
    environment:
      - ENABLE_LOGS_OTEL=true

  sendmock:
    build:
      context: ./external/sendmock
      dockerfile: Dockerfile
    container_name: sendmock-perf
    environment:
      - MOCK_MODE=RANDOM

  alarm-api:
    build: .
    container_name: alarm-api-perf
    depends_on:
      - kafka
      - redis
      - postgres-perf
      - otel-lgtm
      - sendmock
    deploy:
      replicas: 1
      resources:
        limits:
          # cpus 제한 해제: Spring Boot(멀티스레드)의 정상적인 동시성 처리(Kafka + Tomcat)를 위해 호스트 CPU를 자유롭게 쓰도록 변경
          memory: 2048M    # OOM 방지를 위해 메모리 넉넉히 확보 (2GB)
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=perf
      - DB_URL=jdbc:postgresql://postgres-perf:5432/alarmdb
      - KAFKA_BOOTSTRAP_SERVERS=kafka-perf:29092
      - REDIS_HOST=redis-perf
      - REDIS_PORT=6379
      - MOCK_API_URL=http://sendmock-perf:8081
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm-perf:4318
      - OTEL_SERVICE_NAME=alarm-api-perf
      - HIKARI_MAX_POOL=100

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: redis-exporter-perf
    environment:
      REDIS_ADDR: "redis://redis-perf:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-perf
    environment:
      DATA_SOURCE_NAME: "postgresql://alarmuser:alarmpass@postgres-perf:5432/alarmdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres-perf

  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: kafka-exporter-perf
    command: ["--kafka.server=kafka-perf:29092"]
    ports:
      - "9308:9308"
    depends_on:
      - kafka

  prometheus-perf:
    image: prom/prometheus:latest
    container_name: prometheus-perf
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - alarm-api
      - kafka-exporter
      - postgres-exporter
      - redis-exporter
