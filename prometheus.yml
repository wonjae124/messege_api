scrape_configs:
  - job_name: 'alarm-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['alarm-api-perf:8080']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter-perf:9308']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter-perf:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter-perf:9121']
